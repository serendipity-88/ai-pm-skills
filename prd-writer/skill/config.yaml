# ============================================================
# PRD-Writer Skill 配置文件
# 修改此文件自定义 PRD 输出行为，不需要改动 SKILL.md
# ============================================================

# --- 文档发布配置 ---

# PRD 生成后通常需要发布到团队文档平台。首次使用时由 agent 探测当前环境
# 可用的 CLI / MCP / API 配置，并让用户选择发布目标；不要默认上传到固定空间。
publish:
  # ask: 每次发布前确认；always: 使用下方默认目标自动发布；never: 只生成本地文件
  mode: ask

  # provider 可选：yuque / feishu / dingtalk / notion / local
  # null 表示首次运行时让用户选择
  provider: null

  # 固定发布目标。null 表示每次询问或由 provider 自行探测。
  target: null

  providers:
    yuque:
      book_id: null
      book_name: null
    feishu:
      space_id: null
      folder_token: null
    dingtalk:
      workspace_id: null
      folder_id: null
    notion:
      database_id: null
      parent_page_id: null
    local:
      output_dir: "prd/"

# --- 默认值 ---

defaults:
  # PRD 受众描述，影响写作详略和术语使用
  # 常见值:
  #   "产品评审用，面向技术、测试、设计等所有人" — 最详细，覆盖所有角色
  #   "技术评审用，面向开发和测试" — 可省略业务背景，侧重技术细节
  #   "管理层汇报用" — 侧重目标、ROI、里程碑，省略实现细节
  audience: "产品评审用，面向技术、测试、设计等所有人"

  # PRD 变更记录中的作者署名
  author: "AI 生成"

  # PRD 标题中的领域前缀（全角竖线分隔）
  # 示例: "支付成功率" → 输出标题为 "支付成功率｜{需求名称}"
  # 设为 null 则不加领域前缀
  domain_prefix: null
