# ============================================================
# PRD-Writer Skill 配置文件
# 修改此文件自定义 PRD 输出行为，不需要改动 SKILL.md
# ============================================================

# --- 语雀同步配置 ---

yuque:
  # 是否在生成 Markdown 后自动同步到语雀
  # 设为 false 则跳过语雀同步
  auto_sync: true

  # 语雀知识库 ID
  # 获取方式: 打开知识库页面 → URL 中的数字，或通过语雀 API 查询
  # 设为 null 则每次询问用户同步到哪个知识库
  book_id: 177051568

  # 知识库名称（仅用于日志显示，不影响同步逻辑）
  book_name: "N项目-容淼"

# --- 默认值 ---

defaults:
  # PRD 受众描述，影响写作详略和术语使用
  # 常见值:
  #   "产品评审用，面向技术、测试、设计等所有人" — 最详细，覆盖所有角色
  #   "技术评审用，面向开发和测试" — 可省略业务背景，侧重技术细节
  #   "管理层汇报用" — 侧重目标、ROI、里程碑，省略实现细节
  audience: "产品评审用，面向技术、测试、设计等所有人"

  # PRD 变更记录中的作者署名
  author: "AI 生成"

  # PRD 标题中的领域前缀（全角竖线分隔）
  # 示例: "支付成功率" → 输出标题为 "支付成功率｜{需求名称}"
  # 设为 null 则不加领域前缀
  domain_prefix: null
