<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>会议室预订系统架构图</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      color: #e2e8f0;
      padding: 24px;
    }
    .header {
      max-width: 1200px;
      margin: 0 auto 24px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
    .header p {
      color: #64748b;
      margin-top: 8px;
      font-size: 14px;
    }
    .diagram-container {
      max-width: 1200px;
      margin: 0 auto 24px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid #1e293b;
      padding: 24px;
    }
    svg {
      width: 100%;
      height: auto;
    }
    .cards {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 16px;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .card-dot.cyan { background: #22d3ee; }
    .card-dot.emerald { background: #34d399; }
    .card-dot.violet { background: #a78bfa; }
    .card h3 {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }
    .card ul {
      list-style: none;
    }
    .card li {
      color: #94a3b8;
      font-size: 13px;
      padding: 4px 0;
    }
    .card li::before {
      content: '• ';
      color: #475569;
    }
    .footer {
      max-width: 1200px;
      margin: 24px auto 0;
      color: #475569;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span class="pulse-dot"></span>
      会议室预订系统架构图
    </h1>
    <p>基于 Kubernetes 的微服务架构 · 钉钉容器化部署</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
      <!-- Background Grid -->
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
      </defs>

      <rect width="1000" height="680" fill="#020617"/>
      <rect width="1000" height="680" fill="url(#grid)"/>

      <!-- Arrows (drawn first so they appear behind components) -->
      <path d="M 500 120 L 500 160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <path d="M 500 240 L 500 280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <path d="M 500 400 L 500 440" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <path d="M 350 340 L 350 360 L 200 360 L 200 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <path d="M 500 340 L 500 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <path d="M 650 340 L 650 360 L 800 360 L 800 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

      <!-- Kubernetes Cluster Boundary -->
      <rect x="50" y="200" width="900" height="320" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,4"/>
      <text x="65" y="225" fill="#fbbf24" font-size="11" font-weight="600">Kubernetes Cluster</text>

      <!-- Layer 1: Frontend -->
      <rect x="350" y="70" width="300" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="500" y="95" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">H5 前端</text>
      <text x="500" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">钉钉容器内运行</text>

      <!-- External: DingTalk -->
      <rect x="50" y="70" width="200" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="150" y="95" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">钉钉 API</text>
      <text x="150" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">免登 / 消息推送</text>

      <!-- Layer 2: API Gateway -->
      <rect x="350" y="190" width="300" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="500" y="215" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">API Gateway</text>
      <text x="500" y="235" fill="#94a3b8" font-size="9" text-anchor="middle">鉴权 / 限流 / 路由</text>

      <!-- Layer 3: Backend Services -->
      <rect x="120" y="310" width="220" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="230" y="335" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">预订服务</text>
      <text x="230" y="355" fill="#94a3b8" font-size="9" text-anchor="middle">核心业务逻辑</text>

      <rect x="390" y="310" width="220" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="500" y="335" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">会议室服务</text>
      <text x="500" y="355" fill="#94a3b8" font-size="9" text-anchor="middle">会议室/时段管理</text>

      <rect x="660" y="310" width="220" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="770" y="335" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">审批服务</text>
      <text x="770" y="355" fill="#94a3b8" font-size="9" text-anchor="middle">自动审批规则</text>

      <!-- Message Bus -->
      <rect x="350" y="400" width="300" height="20" rx="4" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1"/>
      <text x="500" y="415" fill="#fb923c" font-size="7" text-anchor="middle">RocketMQ 消息总线</text>

      <!-- Layer 4: Data Storage -->
      <rect x="150" y="470" width="180" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="240" y="495" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">MySQL</text>
      <text x="240" y="515" fill="#94a3b8" font-size="9" text-anchor="middle">主数据库</text>

      <rect x="410" y="470" width="180" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="500" y="495" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Redis</text>
      <text x="500" y="515" fill="#94a3b8" font-size="9" text-anchor="middle">缓存 / 分布式锁</text>

      <!-- External: Calendar Service -->
      <rect x="750" y="470" width="150" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
      <text x="825" y="495" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">日历服务</text>
      <text x="825" y="515" fill="#94a3b8" font-size="9" text-anchor="middle">钉钉日历同步</text>

      <!-- Legend -->
      <g transform="translate(50, 570)">
        <text x="0" y="0" fill="#64748b" font-size="10" font-weight="600">图例：</text>
        <rect x="0" y="10" width="16" height="16" rx="4" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="24" y="22" fill="#94a3b8" font-size="9">前端</text>
        <rect x="80" y="10" width="16" height="16" rx="4" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="104" y="22" fill="#94a3b8" font-size="9">后端服务</text>
        <rect x="180" y="10" width="16" height="16" rx="4" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="204" y="22" fill="#94a3b8" font-size="9">数据存储</text>
        <rect x="280" y="10" width="16" height="16" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="304" y="22" fill="#94a3b8" font-size="9">K8s 集群边界</text>
        <rect x="400" y="10" width="16" height="16" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="424" y="22" fill="#94a3b8" font-size="9">外部依赖</text>
      </g>
    </svg>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-header">
        <div class="card-dot cyan"></div>
        <h3>前端层</h3>
      </div>
      <ul>
        <li>H5 页面运行在钉钉容器内</li>
        <li>支持免登和原生能力调用</li>
        <li>可视化时段选择界面</li>
      </ul>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-dot emerald"></div>
        <h3>后端服务</h3>
      </div>
      <ul>
        <li>预订服务：核心业务逻辑</li>
        <li>会议室服务：资源管理</li>
        <li>审批服务：自动审批规则</li>
      </ul>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-dot violet"></div>
        <h3>数据存储</h3>
      </div>
      <ul>
        <li>MySQL：持久化存储</li>
        <li>Redis：缓存和分布式锁</li>
        <li>RocketMQ：异步消息通知</li>
      </ul>
    </div>
  </div>

  <div class="footer">
    Generated by architecture-diagram skill · 2026-04-16
  </div>
</body>
</html>
