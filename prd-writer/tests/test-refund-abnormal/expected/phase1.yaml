  # --- 补充推断 ---
  29_pipeline:
    expected: "多端"
    reason: "用户端→商家端审核→平台介入，3方交互"

  30_risk:
    expected: "触发"
    reason: "命中关键词：退款、大额（>500元人工审核）、审计"

